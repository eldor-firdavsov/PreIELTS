<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>IELTS Practice</title>

    <!--
      Source Sans 3 carries the interface, Source Serif 4 the long-form reading,
      IBM Plex Mono the clock and the figures. Two of the three are one
      superfamily, drawn to the same skeleton, which is why they sit together.

      The stack in tokens.css used to name Inter and load nothing, so every
      screen silently rendered in system-ui. `display=swap` keeps text readable
      while the faces arrive, which matters more here than a flash: a student
      mid-passage must never be looking at nothing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
